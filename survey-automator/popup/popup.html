<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey QA Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>
        </svg>
      </div>
      <div>
        <h1 class="logo-title">SurveyBot</h1>
        <span class="logo-sub">AI Survey Automator</span>
      </div>
    </div>
    <button class="settings-btn" id="openSettings" title="Settings">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <!-- Detection Status -->
  <div class="detection-card" id="detectionCard">
    <div class="detection-left">
      <div class="platform-badge" id="platformBadge">
        <span id="platformIcon">🔍</span>
        <span id="platformName">Scanning page…</span>
      </div>
    </div>
    <div class="status-dot-wrapper">
      <div class="status-dot idle" id="statusDot"></div>
      <span class="status-text" id="statusText">Idle</span>
    </div>
  </div>

  <!-- Profile Selector -->
  <div class="section">
    <label class="section-label">Active Profile</label>
    <div class="profile-select-wrapper">
      <select class="profile-select" id="profileSelect">
        <option value="">— Select a profile —</option>
      </select>
      <div class="select-arrow">▾</div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-section" id="progressSection">
    <div class="progress-header">
      <span class="progress-label" id="progressLabel">Waiting to start</span>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="message-line" id="messageLine"></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn start" id="btnStart" title="Start (Alt+Shift+S)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Start
    </button>
    <button class="ctrl-btn pause" id="btnPause" title="Pause (Alt+Shift+P)" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      Pause
    </button>
    <button class="ctrl-btn stop" id="btnStop" title="Stop (Alt+Shift+X)" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      Stop
    </button>
  </div>

  <!-- Speed Slider -->
  <div class="section">
    <div class="speed-header">
      <label class="section-label">Speed</label>
      <span class="speed-value" id="speedValue">Normal</span>
    </div>
    <div class="speed-slider-wrapper">
      <span class="speed-label-min">🐢 Slow</span>
      <input type="range" min="0" max="2" step="1" value="1" class="speed-slider" id="speedSlider" />
      <span class="speed-label-max">Fast ⚡</span>
    </div>
  </div>

  <!-- Stats Row -->
  <div class="stats-row" id="statsRow">
    <div class="stat-item">
      <span class="stat-value" id="statAnswered">0</span>
      <span class="stat-label">Answered</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-value" id="statPage">1</span>
      <span class="stat-label">Page</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-value" id="statHistory">0</span>
      <span class="stat-label">Surveys</span>
    </div>
  </div>

  <!-- No profile warning -->
  <div class="warning-banner" id="warningBanner" style="display:none;">
    ⚠️ No profile selected. <a href="#" id="goCreateProfile">Create one →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
